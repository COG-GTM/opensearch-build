---
name: 'Sign Artifacts'
description: >-
  Port of the rpm branch of the shared-library step signArtifacts() (opensearch-build-libraries
  vars/signArtifacts.groovy), which is the only branch the two migrated pipelines reach (through assembleManifest for
  the rpm distribution). Jenkins pulled seven 1Password secrets and assumed jenkins-prod-rpm-signing-assume-role; here
  the values come from repository secrets passed in as inputs and the role is assumed through GitHub OIDC, so the
  calling job needs `permissions: id-token: write`.
  The mac, windows, jar_signer and PGP branches of signArtifacts() are not reachable from
  distribution-build.jenkinsfile or integ-test.jenkinsfile and were deliberately not ported - see
  docs/jenkins-to-actions.md.

inputs:
  artifact-path:
    description: 'Directory or file to sign'
    required: true
  sigtype:
    description: 'Signature type. Only .rpm is supported by this action.'
    required: true
  platform:
    description: 'Distribution platform'
    required: false
    default: 'linux'
  email:
    description: 'Signing identity: release@opensearch.org or opensearch@amazon.com'
    required: false
    default: 'release@opensearch.org'
  rpm-signing-account:
    description: 'AWS account holding jenkins-prod-rpm-signing-assume-role'
    required: true
  rpm-signing-role-name:
    description: 'Role to assume for signing'
    required: false
    default: 'jenkins-prod-rpm-signing-assume-role'
  aws-region:
    description: 'Region the signing secrets live in'
    required: false
    default: 'us-west-2'

runs:
  using: 'composite'
  steps:
    - name: Reject unsupported signature types
      if: ${{ inputs.sigtype != '.rpm' }}
      shell: bash
      run: |
        echo "::error::Only .rpm signing is ported; sigtype '${{ inputs.sigtype }}' needs the signer-client workflow."
        exit 1

    - name: Assume the rpm signing role
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.rpm-signing-account }}:role/${{ inputs.rpm-signing-role-name }}
        role-duration-seconds: 900
        role-session-name: github-actions-signing-session
        aws-region: ${{ inputs.aws-region }}

    - name: Check gpg and rpm versions
      shell: bash
      run: |
        set -euo pipefail
        gpg_version_requirement='2.2.0'
        # https://bugzilla.redhat.com/show_bug.cgi?id=227632
        rpm_version_requirement='4.13.0'
        gpg_version_check=$(gpg --version | head -n 1 | grep -oE '[0-9.]+')
        rpm_version_check=$(rpm --version | head -n 1 | grep -oE '[0-9.]+')
        gpg_lowest=$(printf '%s\n%s\n' "${gpg_version_check}" "${gpg_version_requirement}" | sort -V | head -n 1)
        rpm_lowest=$(printf '%s\n%s\n' "${rpm_version_check}" "${rpm_version_requirement}" | sort -V | head -n 1)
        echo "gpg ${gpg_version_check} (requires ${gpg_version_requirement}), rpm ${rpm_version_check} (requires ${rpm_version_requirement})"
        if [ "${gpg_lowest}" = "${gpg_version_requirement}" ] && [ "${rpm_lowest}" = "${rpm_version_requirement}" ]; then
          echo 'Utility version is equal or greater than set limit, continue.'
        else
          echo 'Utility version is lower than set limit, exit 1'
          exit 1
        fi

    - name: Sign the rpm artifacts
      shell: bash
      env:
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        SIGNING_EMAIL: ${{ inputs.email }}
      # Jenkins read the seven rpm-signing values from op://opensearch-release-secrets/rpm-signing/* inside
      # withSecrets(). Composite actions cannot read secrets, so the calling job must export
      # RPM_RELEASE_SIGNING_PASSPHRASE_SECRETS_ARN, RPM_RELEASE_SIGNING_SECRET_KEY_ID_SECRETS_ARN,
      # RPM_RELEASE_SIGNING_KEY_ID, RPM_SIGNING_PASSPHRASE_SECRETS_ARN, RPM_SIGNING_SECRET_KEY_ID_SECRETS_ARN and
      # RPM_SIGNING_KEY_ID from repository secrets - see docs/jenkins-to-actions.md.
      run: |
        set -euo pipefail
        set +x
        export GPG_TTY=$(tty || true)

        PASSPHRASE_SECRETS_ARN="${RPM_RELEASE_SIGNING_PASSPHRASE_SECRETS_ARN}"
        SECRET_KEY_ID_SECRETS_ARN="${RPM_RELEASE_SIGNING_SECRET_KEY_ID_SECRETS_ARN}"
        KEY_ID="${RPM_RELEASE_SIGNING_KEY_ID}"
        KEY_NAME='OpenSearch Project'
        if [ "${SIGNING_EMAIL}" = 'opensearch@amazon.com' ]; then
          PASSPHRASE_SECRETS_ARN="${RPM_SIGNING_PASSPHRASE_SECRETS_ARN}"
          SECRET_KEY_ID_SECRETS_ARN="${RPM_SIGNING_SECRET_KEY_ID_SECRETS_ARN}"
          KEY_ID="${RPM_SIGNING_KEY_ID}"
          KEY_NAME='OpenSearch project'
        fi

        echo 'Setup RPM macros'
        cp -v scripts/pkg/sign_templates/rpmmacros ~/.rpmmacros
        sed -i "s/##key_name##/${KEY_NAME}/g;s/##passphrase_name##/passphrase/g" ~/.rpmmacros

        echo 'Import OpenSearch keys'
        aws secretsmanager get-secret-value --region '${{ inputs.aws-region }}' --secret-id "${PASSPHRASE_SECRETS_ARN}" \
          | jq -r .SecretBinary | base64 --decode > passphrase
        aws secretsmanager get-secret-value --region '${{ inputs.aws-region }}' --secret-id "${SECRET_KEY_ID_SECRETS_ARN}" \
          | jq -r .SecretBinary | base64 --decode | gpg --quiet --import --pinentry-mode loopback --passphrase-file passphrase -

        echo 'Start signing rpm'
        if file "${ARTIFACT_PATH}" | grep -q directory; then
          for rpm_file in $(ls "${ARTIFACT_PATH}"); do
            if file "${ARTIFACT_PATH}/${rpm_file}" | grep -q RPM; then
              rpm --addsign "${ARTIFACT_PATH}/${rpm_file}"
              rpm -qip "${ARTIFACT_PATH}/${rpm_file}" | grep Signature
            fi
          done
        elif file "${ARTIFACT_PATH}" | grep -q RPM; then
          rpm --addsign "${ARTIFACT_PATH}"
          rpm -qip "${ARTIFACT_PATH}" | grep Signature
        else
          echo 'This is neither a directory nor a RPM pkg, exit 1'
          exit 1
        fi

        echo 'Clean up gpg'
        gpg --batch --yes --delete-secret-keys "${KEY_ID}"
        gpg --batch --yes --delete-keys "${KEY_ID}"
        rm -v passphrase
