---
name: 'Update Build Failure Issues'
description: >-
  Port of the shared-library step updateBuildFailureIssues() (opensearch-build-libraries
  vars/updateBuildFailureIssues.groovy) plus the createGithubIssue()/closeGithubIssue() steps it calls. Reads the
  per-component build results back out of the metrics cluster, then autocuts an issue in every component repository
  that failed and closes the autocut issue of every component that passed. The Jenkins 1Password github-bot
  credentials become the `github-token` input, which must be a token with issue write access on the component
  repositories - the default GITHUB_TOKEN cannot write to other repositories.

inputs:
  input-manifest:
    description: 'Relative path to the input manifest'
    required: true
  distribution-build-number:
    description: 'Distribution build number the results were indexed with'
    required: true
  build-url:
    description: 'URL of the distribution build run, used in the issue body (Jenkins RUN_DISPLAY_URL)'
    required: true
  build-start-time-from:
    description: 'Start of the build_start_time range used to find the results'
    required: false
    default: 'now-6h'
  build-start-time-to:
    description: 'End of the build_start_time range used to find the results'
    required: false
    default: 'now'
  metrics-host-url:
    description: 'Metrics cluster endpoint'
    required: true
  metrics-host-account:
    description: 'AWS account of the metrics cluster'
    required: true
  metrics-role-name:
    description: 'Role assumed to reach the metrics cluster'
    required: false
    default: 'OpenSearchJenkinsAccessRole'
  metrics-index:
    description: 'Index queried for the component results'
    required: false
    default: 'opensearch-distribution-build-results'
  aws-region:
    description: 'Region used for SigV4 signing'
    required: false
    default: 'us-east-1'
  github-token:
    description: 'Token used for the gh issue calls'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Assume the metrics cluster role
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.metrics-host-account }}:role/${{ inputs.metrics-role-name }}
        role-duration-seconds: 900
        role-session-name: github-actions-metrics-session
        aws-region: ${{ inputs.aws-region }}

    - name: Fetch the component build results
      shell: bash
      env:
        METRICS_HOST_URL: ${{ inputs.metrics-host-url }}
        METRICS_INDEX: ${{ inputs.metrics-index }}
        REGION: ${{ inputs.aws-region }}
        INPUT_MANIFEST: ${{ inputs.input-manifest }}
        DISTRIBUTION_BUILD_NUMBER: ${{ inputs.distribution-build-number }}
        BUILD_START_TIME_FROM: ${{ inputs.build-start-time-from }}
        BUILD_START_TIME_TO: ${{ inputs.build-start-time-to }}
      run: |
        set -euo pipefail
        set +x
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        # The signing credentials go into a 0600 curl config file instead of the command line, so they never appear in
        # the process table of a runner that is also executing build and test code.
        CURL_CONFIG=$(mktemp)
        chmod 600 "${CURL_CONFIG}"
        trap 'rm -f "${CURL_CONFIG}"' EXIT
        {
          echo "aws-sigv4 = \"aws:amz:${REGION}:es\""
          echo "user = \"${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}\""
          echo "header = \"x-amz-security-token:${AWS_SESSION_TOKEN}\""
        } > "${CURL_CONFIG}"

        for RESULT in failed passed; do
          python3 "${GITHUB_WORKSPACE}/.github/scripts/build_failure_issues.py" query \
            --input-manifest "${INPUT_MANIFEST}" \
            --distribution-build-number "${DISTRIBUTION_BUILD_NUMBER}" \
            --build-start-time-from "${BUILD_START_TIME_FROM}" \
            --build-start-time-to "${BUILD_START_TIME_TO}" \
            --result "${RESULT}" > "query-${RESULT}.json"
          curl -s -XGET "${METRICS_HOST_URL}/${METRICS_INDEX}/_search" \
            --config "${CURL_CONFIG}" \
            -H 'Content-Type: application/json' \
            --data-binary "@query-${RESULT}.json" > "response-${RESULT}.json"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/build_failure_issues.py" components \
            --response "response-${RESULT}.json" > "components-${RESULT}.txt"
          echo "${RESULT} components: $(tr '\n' ' ' < "components-${RESULT}.txt")"
        done

    - name: Create and close the autocut issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_URL: ${{ inputs.build-url }}
        INPUT_MANIFEST: ${{ inputs.input-manifest }}
      run: |
        set -euo pipefail
        VERSION=$(python3 -c "import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))['build']['version'])" "${INPUT_MANIFEST}")

        python3 "${GITHUB_WORKSPACE}/.github/scripts/build_failure_issues.py" plan \
          --input-manifest "${INPUT_MANIFEST}" \
          --failed components-failed.txt \
          --passed components-passed.txt > issue-plan.tsv

        # createGithubIssue.groovy:28 defaults daysToReOpen to 3: an autocut issue closed within that window is
        # reopened instead of being cut again.
        REOPEN_AFTER=$(date -u -d '3 days ago' +'%Y-%m-%d')

        while IFS=$'\t' read -r ACTION REPO_URL COMPONENT; do
          TITLE="[AUTOCUT] Distribution Build Failed for ${COMPONENT}-${VERSION}"
          # gh resolves the manifest `repository` value (a https://github.com/<owner>/<repo>.git URL) itself, exactly
          # as the Jenkins steps passed it through.
          EXISTING=$(gh issue list --repo "${REPO_URL}" -S "${TITLE} in:title" --json number --jq '.[0].number // empty' || true)
          RECENTLY_CLOSED=$(gh issue list --repo "${REPO_URL}" -S "${TITLE} in:title is:closed closed:>=${REOPEN_AFTER}" \
            --json number --jq '.[0].number // empty' || true)

          if [ "${ACTION}" = 'create' ]; then
            BODY="***Build Failed Error***: **${COMPONENT} failed during the distribution build for version: ${VERSION}.**
        Please see build log at ${RUN_URL}.
        The failed build job will be marked as failed. Please see the ./build.sh step for more details.
        Checkout the [wiki](https://github.com/opensearch-project/opensearch-build/wiki/Building-an-OpenSearch-and-OpenSearch-Dashboards-Distribution) to reproduce the failure locally."
            if [ -n "${EXISTING}" ]; then
              echo "Issue for ${COMPONENT} already exists, editing the issue body"
              gh issue edit "${EXISTING}" --repo "${REPO_URL}" --body "${BODY}"
            elif [ -n "${RECENTLY_CLOSED}" ]; then
              # createGithubIssue.groovy:63-79 re-opens and updates a recently closed issue.
              echo "Re-opening the recently closed issue for ${COMPONENT}"
              gh issue reopen "${RECENTLY_CLOSED}" --repo "${REPO_URL}"
              gh issue edit "${RECENTLY_CLOSED}" --repo "${REPO_URL}" --body "${BODY}"
            else
              echo "Creating a new issue for ${COMPONENT}"
              for LABEL in autocut "v${VERSION}"; do
                if [ "$(gh label list --repo "${REPO_URL}" -S "${LABEL}" --json name --jq '.[0].name // empty' || true)" != "${LABEL}" ]; then
                  gh label create "${LABEL}" --repo "${REPO_URL}" || true
                fi
              done
              gh issue create --repo "${REPO_URL}" --title "${TITLE}" --body "${BODY}" \
                --label "autocut,v${VERSION}" --label untriaged
            fi
          elif [ -n "${EXISTING}" ]; then
            echo "Closing the issue for ${COMPONENT}"
            gh issue close "${EXISTING}" --repo "${REPO_URL}" --comment "Closing the issue as the distribution build for ${COMPONENT} has passed for version: **${VERSION}**.
        Please see build log at ${RUN_URL}"
          else
            echo "No open autocut issue to close for ${COMPONENT}"
          fi
          sleep 3
        done < issue-plan.tsv
