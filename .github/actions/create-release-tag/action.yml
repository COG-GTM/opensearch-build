---
# Ports jenkins/vars/createReleaseTag.groovy:9-70 and
# jenkins/release-workflows/release-tag.jenkinsfile:42-77. See
# docs/jenkins-to-actions-release-promotion.md. Jenkins embedded the bot token
# in an HTTPS URL; this action uses git http.extraheader so it never reaches
# .git/config or command output.
name: 'Create component release tags'
description: 'Create and push release tags for every component in a bundle manifest.'

inputs:
  dist-manifest:
    required: true
  tag-version:
    required: true
  github-bot-token:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create component tags
      shell: bash
      env:
        DIST_MANIFEST: ${{ inputs.dist-manifest }}
        VERSION: ${{ inputs.tag-version }}
        GITHUB_BOT_TOKEN: ${{ inputs.github-bot-token }}
      run: |
        set -euo pipefail
        if [[ -z "${GITHUB_BOT_TOKEN}" ]]; then
          echo '::error::GITHUB_BOT_TOKEN must be configured; the default GITHUB_TOKEN cannot push to component repositories.'
          exit 1
        fi
        components_json=$(python .github/scripts/release_manifest_facts.py bundle-manifest-components --manifest "${DIST_MANIFEST}")
        untagged=()
        while IFS= read -r component; do
          name=$(jq -r '.name' <<< "${component}")
          repo=$(jq -r '.repo' <<< "${component}")
          commit_id=$(jq -r '.commit_id' <<< "${component}")
          tag_version=$(jq -r '.tag_version' <<< "${component}")
          echo "Tagging ${name} at ${commit_id} ..."
          workdir="${RUNNER_TEMP}/release-tag-${name//[^A-Za-z0-9_.-]/-}"
          rm -rf "${workdir}"
          git -c "http.extraheader=Authorization: Bearer ${GITHUB_BOT_TOKEN}" clone --quiet "${repo}" "${workdir}"
          git -C "${workdir}" fetch --quiet origin "${commit_id}"
          git -C "${workdir}" checkout --quiet --detach "${commit_id}"
          tag_id=$(git -c "http.extraheader=Authorization: Bearer ${GITHUB_BOT_TOKEN}" ls-remote --tags "${repo}" "${tag_version}" | awk 'NR==1{print $1}')
          if [[ -z "${tag_id}" ]]; then
            echo "Creating ${tag_version} tag for ${name}"
            git -C "${workdir}" tag "${tag_version}"
            if ! git -C "${workdir}" -c "http.extraheader=Authorization: Bearer ${GITHUB_BOT_TOKEN}" \
              push origin "${tag_version}" >/dev/null; then
              untagged+=("${name}")
            fi
          elif [[ "${tag_id}" == "${commit_id}" ]]; then
            echo "Tag ${tag_version} has been created with identical commit ID. Skipping creating new tag for ${name}."
          else
            echo "::error::Tag ${tag_version} already existed in ${name} with a different commit ID. Please check this."
            exit 1
          fi
        done < <(jq -c '.[]' <<< "${components_json}")
        if [[ "${#untagged[@]}" -ne 0 ]]; then
          printf '::error::Having issues creating tag in some repos. Please resolve it manually.\nList of untagged repos:\n%s\n' "${untagged[*]}"
          exit 1
        fi
