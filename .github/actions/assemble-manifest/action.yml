---
name: 'Assemble Manifest'
description: >-
  Port of the shared-library step assembleManifest() (opensearch-build-libraries vars/assembleManifest.groovy). Runs
  ./assemble.sh against a build manifest and, for the rpm distribution, signs the package and builds the yum repository
  metadata. The signing email follows the Jenkins rule: release@opensearch.org for major version > 2, otherwise
  opensearch@amazon.com.

inputs:
  build-manifest:
    description: 'Path to the build manifest generated by build.sh'
    required: true
  job-name:
    description: 'Artifact path prefix, equivalent to the Jenkins JOB_NAME'
    required: false
    default: 'distribution-build-opensearch'
  build-number:
    description: 'Build number, equivalent to the Jenkins BUILD_NUMBER'
    required: true
  public-artifact-url:
    description: 'Public artifact URL used as the assemble --base-url'
    required: false
    default: 'https://ci.opensearch.org/ci/dbc'
  sign-rpm:
    description: >-
      Sign the rpm package and build the yum repo. Jenkins always did this for rpm; in the fork it is opt-in because it
      needs the production RPM signing account.
    required: false
    default: 'false'
  rpm-signing-account:
    description: 'AWS account holding jenkins-prod-rpm-signing-assume-role'
    required: false
    default: ''

outputs:
  base-url:
    description: 'Artifact root URL without the distribution segment, passed to assemble.sh as --base-url'
    value: ${{ steps.info.outputs.artifact-root-url-without-distribution }}
  distribution:
    description: 'Distribution of the build manifest'
    value: ${{ steps.info.outputs.distribution }}
  filename:
    description: 'Product filename, e.g. opensearch'
    value: ${{ steps.info.outputs.filename }}

runs:
  using: 'composite'
  steps:
    - name: Read the build manifest
      id: info
      shell: bash
      run: |
        set -euo pipefail
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        python3 "${GITHUB_WORKSPACE}/.github/scripts/manifest_paths.py" build-manifest-info \
          '${{ inputs.build-manifest }}' \
          --job-name '${{ inputs.job-name }}' \
          --build-number '${{ inputs.build-number }}' \
          --public-artifact-url '${{ inputs.public-artifact-url }}' | tee -a "$GITHUB_OUTPUT" > manifest-info.txt
        VERSION=$(grep '^version=' manifest-info.txt | cut -d= -f2)
        # assembleManifest.groovy:276 - majorVersion > 2 signs with release@opensearch.org
        if [ "$(echo "${VERSION}" | cut -d. -f1)" -gt 2 ]; then
          echo 'signing-email=release@opensearch.org' >> "$GITHUB_OUTPUT"
        else
          echo 'signing-email=opensearch@amazon.com' >> "$GITHUB_OUTPUT"
        fi

    - name: Assemble the distribution
      shell: bash
      run: |
        set -euo pipefail
        ./assemble.sh '${{ inputs.build-manifest }}' --base-url '${{ steps.info.outputs.artifact-root-url-without-distribution }}'

    - name: Sign the rpm package
      if: ${{ steps.info.outputs.distribution == 'rpm' && inputs.sign-rpm == 'true' }}
      uses: ./.github/actions/sign-artifacts
      with:
        artifact-path: rpm/dist/${{ steps.info.outputs.filename }}
        sigtype: '.rpm'
        platform: linux
        email: ${{ steps.info.outputs.signing-email }}
        rpm-signing-account: ${{ inputs.rpm-signing-account }}

    - name: Build the yum repository metadata
      if: ${{ steps.info.outputs.distribution == 'rpm' }}
      uses: ./.github/actions/build-yum-repo
      with:
        build-manifest: ${{ inputs.build-manifest }}
        base-url: ${{ steps.info.outputs.artifact-root-url-without-distribution }}
        build-number: ${{ inputs.build-number }}
