---
name: 'Run Integ Test Script'
description: >-
  Port of the shared-library step runIntegTestScript() (opensearch-build-libraries vars/runIntegTestScript.groovy).
  Builds the ./test.sh integ-test command line from the build manifest and runs it for a single component.

inputs:
  component-name:
    description: 'Component under test'
    required: true
  test-manifest:
    description: 'Path to the test manifest'
    required: true
  build-manifest:
    description: 'Path to the downloaded build manifest'
    required: true
  job-name:
    description: 'Build job name used to compute the artifact root URL'
    required: false
    default: 'distribution-build-opensearch'
  test-job-name:
    description: >-
      Name of the test job itself, used for --base-path. generateBasePaths() built it from the Jenkins JOB_NAME of the
      integ-test job, not from the distribution build job that produced the artifacts.
    required: false
    default: 'integ-test'
  local-path:
    description: 'Local artifact directory. Empty means resolve the artifacts from the public artifact URL.'
    required: false
    default: ''
  ci-group:
    description: 'CI group to run'
    required: false
    default: ''
  test-run-id:
    description: 'Test run id, the Jenkins BUILD_NUMBER'
    required: true
  switch-user-non-root:
    description: 'Run the test as uid 1000 instead of root, which Jenkins does for rpm and deb'
    required: false
    default: 'false'
  public-artifact-url:
    description: 'Public artifact URL used to build --base-path'
    required: false
    default: 'https://ci.opensearch.org/ci/dbc'

runs:
  using: 'composite'
  steps:
    - name: Resolve the artifact paths
      id: paths
      shell: bash
      env:
        BUILD_MANIFEST: ${{ inputs.build-manifest }}
        JOB_NAME: ${{ inputs.job-name }}
        TEST_JOB_NAME: ${{ inputs.test-job-name }}
        PUBLIC_ARTIFACT_URL: ${{ inputs.public-artifact-url }}
        LOCAL_PATH: ${{ inputs.local-path }}
      run: |
        set -euo pipefail
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        python3 "${GITHUB_WORKSPACE}/.github/scripts/manifest_paths.py" integ-test-paths \
          "${BUILD_MANIFEST}" \
          --job-name "${JOB_NAME}" \
          --base-path-job-name "${TEST_JOB_NAME}" \
          --public-artifact-url "${PUBLIC_ARTIFACT_URL}" \
          --local-path "${LOCAL_PATH}" | tee -a "$GITHUB_OUTPUT"

    - name: Detect the test docker agent java version
      id: agent
      # runIntegTestScript.groovy:32 calls detectTestDockerAgent(testManifest:) without a platform or distribution, so
      # the java version comes from the linux/tar image even when the artifacts under test are rpm or windows. The
      # defaults of this action are the same linux/tar, keeping the Jenkins behaviour.
      uses: ./.github/actions/detect-test-docker-agent
      with:
        test-manifest: ${{ inputs.test-manifest }}

    - name: Run the integration tests
      shell: bash
      env:
        TEST_MANIFEST: ${{ inputs.test-manifest }}
        COMPONENT_NAME: ${{ inputs.component-name }}
        TEST_RUN_ID: ${{ inputs.test-run-id }}
        PATHS: ${{ steps.paths.outputs.paths }}
        BASE_PATH: ${{ steps.paths.outputs.base-path }}
        CI_GROUP: ${{ inputs.ci-group }}
        BUILD_FILENAME: ${{ steps.paths.outputs.filename }}
        BUILD_PLATFORM: ${{ steps.paths.outputs.platform }}
        JAVA_VERSION: ${{ steps.agent.outputs.java-version }}
        SWITCH_USER_NON_ROOT: ${{ inputs.switch-user-non-root }}
      run: |
        set -euo pipefail
        # test.sh declares --component and --paths with nargs='*' and TestKwargs splits each argv entry on a single
        # '=' (src/test_workflow/test_kwargs.py:21), so both have to be word split the way the unquoted Jenkins
        # strings were: --paths carries two key=value pairs for an OpenSearch Dashboards build manifest.
        read -ra COMPONENTS <<< "${COMPONENT_NAME}"
        read -ra PATH_PAIRS <<< "${PATHS}"
        ARGS=('./test.sh' 'integ-test' "${TEST_MANIFEST}"
              '--component' ${COMPONENTS[@]+"${COMPONENTS[@]}"}
              '--test-run-id' "${TEST_RUN_ID}"
              '--paths' "${PATH_PAIRS[@]}"
              '--base-path' "${BASE_PATH}")
        if [ -n "${CI_GROUP}" ]; then ARGS+=('--ci-group' "${CI_GROUP}"); fi

        # runIntegTestScript.groovy:32-33 - only the OpenSearch core distribution, and only off windows, pins
        # JAVA_HOME to the CI image java.
        JAVA_HOME_PINNED=false
        if [ "${BUILD_FILENAME}" = 'opensearch' ] && [ "${BUILD_PLATFORM}" != 'windows' ]; then
          export JAVA_HOME="/opt/java/${JAVA_VERSION}"
          JAVA_HOME_PINNED=true
        fi

        if [ "${SWITCH_USER_NON_ROOT}" = 'true' ]; then
          # runIntegTestScript.groovy:68 - rpm and deb tests must not run as root, and docker ENV is not visible to su,
          # so PATH and JAVA_HOME are passed explicitly. Like Jenkins, JAVA_HOME is left out when this step did not pin
          # it - a JAVA_HOME the CI image itself exports (`-e JAVA_HOME=...` in the manifest ci.image args) must not
          # leak into the su environment. https://github.com/opensearch-project/opensearch-build-libraries/issues/197
          ENV_ARGS=("PATH=${PATH}")
          if [ "${JAVA_HOME_PINNED}" = 'true' ]; then ENV_ARGS+=("JAVA_HOME=${JAVA_HOME}"); fi
          su "$(id -un 1000)" -c "env $(printf '%q ' "${ENV_ARGS[@]}")$(printf '%q ' "${ARGS[@]}")"
        else
          "${ARGS[@]}"
        fi
