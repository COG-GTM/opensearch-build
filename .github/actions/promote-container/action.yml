---
# Ports opensearch-build-libraries vars/promoteContainer.groovy:20-110 and
# vars/copyContainer.groovy:19-89 at the origin/lf-jenkins ref, the library
# version pinned by
# jenkins/release-workflows/promote-docker-ecr-lf.jenkinsfile:76-90. Jenkins
# triggered docker-copy jobs; this slice implements their copy locally because
# docker-copy is owned by a parallel migration. See the migration document.
name: 'Promote container'
description: 'Promote one staging image to Docker Hub and/or ECR tags.'

inputs:
  image-repository:
    required: true
  release-version:
    required: true
  docker-hub-promote:
    required: true
  ecr-promote:
    required: true
  tag-latest:
    required: true
  tag-major-version:
    required: true
  data-prepper-staging-container-repository:
    required: false
    default: ''
  readonly-dockerhub-username:
    required: true
  readonly-dockerhub-password:
    required: true
  production-dockerhub-username:
    required: true
  production-dockerhub-password:
    required: true
  artifact-promotion-role-name:
    required: true
  aws-account-artifact:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Resolve source registry
      id: source
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        DATA_PREPPER_STAGING_CONTAINER_REPOSITORY: ${{ inputs.data-prepper-staging-container-repository }}
      run: |
        set -euo pipefail
        registry='opensearchstaging'
        image_product="${IMAGE_REPOSITORY%%:*}"
        if [[ "${image_product}" == data-prepper ]]; then
          if [[ -z "${DATA_PREPPER_STAGING_CONTAINER_REPOSITORY}" ]]; then
            echo '::error::DATA_PREPPER_STAGING_CONTAINER_REPOSITORY is not configured; refusing to promote a data-prepper image from the default staging registry.'
            exit 1
          fi
          registry="${DATA_PREPPER_STAGING_CONTAINER_REPOSITORY}"
        fi
        echo "registry=${registry}" >> "${GITHUB_OUTPUT}"

    - name: Copy to Docker Hub
      if: ${{ inputs.docker-hub-promote == 'true' }}
      uses: ./.github/actions/copy-container
      with:
        source-registry: ${{ steps.source.outputs.registry }}
        source-image: ${{ inputs.image-repository }}
        destination-registry: opensearchproject
        destination-image: ${{ inputs.image-repository }}
        release-version: ${{ inputs.release-version }}
        tag-major-version: ${{ inputs.tag-major-version }}
        tag-latest: ${{ inputs.tag-latest }}
        readonly-dockerhub-username: ${{ inputs.readonly-dockerhub-username }}
        readonly-dockerhub-password: ${{ inputs.readonly-dockerhub-password }}
        production-dockerhub-username: ${{ inputs.production-dockerhub-username }}
        production-dockerhub-password: ${{ inputs.production-dockerhub-password }}
        artifact-promotion-role-name: ${{ inputs.artifact-promotion-role-name }}
        aws-account-artifact: ${{ inputs.aws-account-artifact }}

    - name: Copy to ECR Public
      if: ${{ inputs.ecr-promote == 'true' }}
      uses: ./.github/actions/copy-container
      with:
        source-registry: ${{ steps.source.outputs.registry }}
        source-image: ${{ inputs.image-repository }}
        destination-registry: public.ecr.aws/opensearchorg/opensearchproject
        destination-image: ${{ inputs.image-repository }}
        release-version: ${{ inputs.release-version }}
        tag-major-version: ${{ inputs.tag-major-version }}
        tag-latest: ${{ inputs.tag-latest }}
        readonly-dockerhub-username: ${{ inputs.readonly-dockerhub-username }}
        readonly-dockerhub-password: ${{ inputs.readonly-dockerhub-password }}
        production-dockerhub-username: ${{ inputs.production-dockerhub-username }}
        production-dockerhub-password: ${{ inputs.production-dockerhub-password }}
        artifact-promotion-role-name: ${{ inputs.artifact-promotion-role-name }}
        aws-account-artifact: ${{ inputs.aws-account-artifact }}
