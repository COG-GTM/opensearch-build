---
name: 'Create SHA-512 checksums'
description: >-
  Port of the shared-library step createSha512Checksums() (opensearch-build-libraries vars/createSha512Checksums.groovy),
  called by promoteArtifacts() and uploadMinSnapshotsToS3(): writes a `<file>.sha512` sidecar
  (`<hash>  <basename>`, the `sha512sum` format) next to every .tar.gz, .zip, .rpm and .deb under a path.
  The Groovy `bat` branch for Windows agents is not ported; run this on a Linux or macOS runner.

inputs:
  artifact-path:
    description: 'File or directory to scan'
    required: true

outputs:
  count:
    description: 'Number of .sha512 files written'
    value: ${{ steps.checksums.outputs.count }}

runs:
  using: 'composite'
  steps:
    - name: Create SHA-512 checksums
      id: checksums
      shell: bash
      env:
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
      run: |
        set -euo pipefail
        allowed_types=('.tar.gz' '.zip' '.rpm' '.deb')
        if [[ ! -e "${ARTIFACT_PATH}" ]]; then
          echo "::error::Artifact path ${ARTIFACT_PATH} does not exist."
          exit 1
        fi
        if command -v sha512sum > /dev/null; then
          sha512() { sha512sum "$1" | awk '{print $1}'; }
        else
          sha512() { shasum -a 512 "$1" | awk '{print $1}'; }
        fi
        # `mapfile -d` needs bash 4.4; the AL2/centos7 CI-runner images ship bash 4.2.
        files=()
        while IFS= read -r -d '' found; do
          files+=("${found}")
        done < <(find "${ARTIFACT_PATH}" -type f ! -name '*.sha512' -print0)
        count=0
        for file in ${files[@]+"${files[@]}"}; do
          accepted=false
          for file_type in "${allowed_types[@]}"; do
            if [[ "${file}" == *"${file_type}" ]]; then
              printf '%s  %s\n' "$(sha512 "${file}")" "$(basename "${file}")" > "${file}.sha512"
              echo "Wrote ${file}.sha512"
              accepted=true
              count=$((count + 1))
              break
            fi
          done
          if [[ "${accepted}" != true ]]; then
            echo "Not generating sha for ${file}, doesn't match allowed types [${allowed_types[*]}]"
          fi
        done
        echo "count=${count}" >> "$GITHUB_OUTPUT"
