---
name: 'Build Manifest'
description: >-
  Port of the shared-library step buildManifest() (opensearch-build-libraries vars/buildManifest.groovy). Assembles the
  ./build.sh command line from the pipeline parameters, and when incremental builds are requested resolves the previous
  build id from the published index.json before retrieving the previous build artifacts.

inputs:
  input-manifest:
    description: 'Relative path to the input manifest, e.g. manifests/3.0.0/opensearch-3.0.0.yml'
    required: true
  component-name:
    description: 'Single component to build. Empty builds every component in the manifest.'
    required: false
    default: ''
  distribution:
    description: 'Distribution to build: tar, rpm, deb or zip'
    required: false
    default: ''
  platform:
    description: 'Platform to build: linux or windows'
    required: false
    default: ''
  architecture:
    description: 'Architecture to build: x64 or arm64'
    required: false
    default: ''
  snapshot:
    description: 'Build a snapshot'
    required: false
    default: 'false'
  lock:
    description: 'Generate a stable reference manifest'
    required: false
    default: 'false'
  continue-on-error:
    description: 'Do not fail the distribution build when a plugin component fails'
    required: false
    default: 'false'
  skip-artifact-check:
    description: 'Skip the artifact check when building components and plugins'
    required: false
    default: 'false'
  incremental:
    description: 'Build only the components that changed since the previous build'
    required: false
    default: 'false'
  previous-build-id:
    description: 'Build id to start the incremental build from. "latest" resolves it from the published index.json.'
    required: false
    default: 'latest'
  parallel:
    description: 'Number of parallel component workers. 0 or empty disables the flag.'
    required: false
    default: '0'
  job-name:
    description: 'Artifact path prefix, equivalent to the Jenkins JOB_NAME'
    required: false
    default: 'distribution-build-opensearch'
  build-number:
    description: >-
      Build number exported as BUILD_NUMBER for ./build.sh. src/build_workflow/build_target.py:41 falls back to a
      random uuid when it is unset, and that id becomes build.id in the build manifest, which every artifact path is
      derived from; the Jenkins agents always had BUILD_NUMBER in the environment.
    required: true
  public-artifact-url:
    description: 'Public artifact URL used to resolve the previous build index'
    required: false
    default: 'https://ci.opensearch.org/ci/dbc'
  artifact-bucket-name:
    description: 'Artifact bucket, only needed when incremental is true'
    required: false
    default: ''
  aws-account-public:
    description: 'AWS account holding the artifact bucket, only needed when incremental is true'
    required: false
    default: ''
  build-log-file:
    description: 'File the build output is tee-ed into so the failed-plugin check can search it'
    required: false
    default: 'build.log'

outputs:
  build-manifest:
    description: 'Path of the build manifest generated by build.sh'
    value: ${{ steps.paths.outputs.build-manifest }}
  incremental-enabled:
    description: 'Whether the build actually ran incrementally'
    value: ${{ steps.previous-build.outputs.incremental-enabled }}

runs:
  using: 'composite'
  steps:
    - name: Resolve manifest metadata
      id: paths
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.input-manifest }}
        DISTRIBUTION: ${{ inputs.distribution }}
      run: |
        set -euo pipefail
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        python3 "${GITHUB_WORKSPACE}/.github/scripts/manifest_paths.py" input-manifest-info \
          "${INPUT_MANIFEST}" > input-manifest-info.txt
        cat input-manifest-info.txt >> "$GITHUB_OUTPUT"
        # build.sh writes the manifest to <distribution>/builds/<filename>/manifest.yml.
        FILENAME=$(grep '^filename=' input-manifest-info.txt | cut -d= -f2)
        echo "build-manifest=${DISTRIBUTION}/builds/${FILENAME}/manifest.yml" >> "$GITHUB_OUTPUT"

    - name: Resolve the previous build id for the incremental build
      id: previous-build
      shell: bash
      env:
        PUBLIC_ARTIFACT_URL: ${{ inputs.public-artifact-url }}
        JOB_NAME: ${{ inputs.job-name }}
        REVISION: ${{ steps.paths.outputs.revision }}
        INCREMENTAL: ${{ inputs.incremental }}
        PREVIOUS_BUILD_ID: ${{ inputs.previous-build-id }}
        PLATFORM: ${{ inputs.platform }}
        ARCHITECTURE: ${{ inputs.architecture }}
        DISTRIBUTION: ${{ inputs.distribution }}
        COMPONENT_NAME: ${{ inputs.component-name }}
      run: |
        set -uo pipefail
        BUILD_NUMBER=''

        # src/build_workflow/build_args.py puts --component and --incremental in one mutually exclusive group, so
        # build.sh would reject the combination after minutes of setup. Jenkins had the same latent conflict
        # (distribution-build.jenkinsfile passes both parameters straight through); failing here reports it up front.
        if [ "${INCREMENTAL}" = 'true' ] && [ -n "${COMPONENT_NAME}" ]; then
          echo '::error::COMPONENT_NAME and the incremental option are mutually exclusive in build.sh. Dispatch with either a component list or `incremental`, not both.'
          exit 1
        fi

        if [ "${INCREMENTAL}" = 'true' ] && [ "$(echo "${PREVIOUS_BUILD_ID}" | tr '[:upper:]' '[:lower:]')" = 'latest' ]; then
          NEW_INDEX_URL="${PUBLIC_ARTIFACT_URL}/${JOB_NAME}/${REVISION}/index/${PLATFORM}/${ARCHITECTURE}/${DISTRIBUTION}/index.json"
          OLD_INDEX_URL="${PUBLIC_ARTIFACT_URL}/${JOB_NAME}/${REVISION}/index.json"
          if BUILD_NUMBER=$(curl -sL --fail "${NEW_INDEX_URL}" | jq -er '.latest'); then
            echo "Use new URL path for the latest index."
          elif BUILD_NUMBER=$(curl -sL --fail "${OLD_INDEX_URL}" | jq -er '.latest'); then
            echo "Use old URL path for the latest index."
          else
            echo "No latest build for ${REVISION} is available. Building all components from the manifest."
            INCREMENTAL='false'
          fi
        else
          BUILD_NUMBER="${PREVIOUS_BUILD_ID}"
        fi

        echo "incremental-enabled=${INCREMENTAL}" >> "$GITHUB_OUTPUT"
        echo "previous-build-number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Retrieve the previous build
      if: ${{ steps.previous-build.outputs.incremental-enabled == 'true' }}
      uses: ./.github/actions/retrieve-previous-build
      with:
        input-manifest: ${{ inputs.input-manifest }}
        platform: ${{ inputs.platform }}
        architecture: ${{ inputs.architecture }}
        distribution: ${{ inputs.distribution }}
        previous-build-number: ${{ steps.previous-build.outputs.previous-build-number }}
        job-name: ${{ inputs.job-name }}
        artifact-bucket-name: ${{ inputs.artifact-bucket-name }}
        aws-account-public: ${{ inputs.aws-account-public }}

    - name: Build the distribution
      shell: bash
      # Every value is read from the environment rather than interpolated into the script, so a manifest name or a
      # component name can never terminate a quote and inject a command.
      env:
        INCREMENTAL_ENABLED: ${{ steps.previous-build.outputs.incremental-enabled }}
        INPUT_MANIFEST: ${{ inputs.input-manifest }}
        COMPONENT_NAME: ${{ inputs.component-name }}
        PLATFORM: ${{ inputs.platform }}
        ARCHITECTURE: ${{ inputs.architecture }}
        DISTRIBUTION: ${{ inputs.distribution }}
        SNAPSHOT: ${{ inputs.snapshot }}
        LOCK: ${{ inputs.lock }}
        CONTINUE_ON_ERROR: ${{ inputs.continue-on-error }}
        SKIP_ARTIFACT_CHECK: ${{ inputs.skip-artifact-check }}
        PARALLEL: ${{ inputs.parallel }}
        BUILD_LOG_FILE: ${{ inputs.build-log-file }}
        # build_target.py reads this to stamp build.id, which has to equal the build number the artifact paths use.
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        set -euo pipefail
        # Jenkins built this argument list in Groovy and dropped the null entries; the shell equivalent appends
        # conditionally. On Windows agents Jenkins shelled out through `bat bash ./build.sh`, which `shell: bash` covers.
        ARGS=('./build.sh' "${INPUT_MANIFEST}")
        if [ -n "${DISTRIBUTION}" ]; then ARGS+=('-d' "${DISTRIBUTION}"); fi
        if [ -n "${COMPONENT_NAME}" ]; then
          # build.sh declares --component with nargs='*' (src/build_workflow/build_args.py:118), so a space separated
          # COMPONENT_NAME has to arrive as one argument per component, the way the unquoted Jenkins string did.
          read -ra COMPONENTS <<< "${COMPONENT_NAME}"
          ARGS+=('--component' "${COMPONENTS[@]}")
        fi
        if [ -n "${PLATFORM}" ]; then ARGS+=('-p' "${PLATFORM}"); fi
        if [ -n "${ARCHITECTURE}" ]; then ARGS+=('-a' "${ARCHITECTURE}"); fi
        if [ "${SNAPSHOT}" = 'true' ]; then ARGS+=('--snapshot'); fi
        if [ "${LOCK}" = 'true' ]; then ARGS+=('--lock'); fi
        if [ "${CONTINUE_ON_ERROR}" = 'true' ]; then ARGS+=('--continue-on-error'); fi
        if [ "${SKIP_ARTIFACT_CHECK}" = 'true' ]; then ARGS+=('--skip-artifact-check'); fi
        if [ "${INCREMENTAL_ENABLED}" = 'true' ]; then ARGS+=('--incremental'); fi
        if [ -n "${PARALLEL}" ] && [ "${PARALLEL}" != '0' ]; then ARGS+=('--parallel' "${PARALLEL}"); fi

        echo "Run command: ${ARGS[*]}"
        # The log is kept so the CONTINUE_ON_ERROR path can search it, the way Jenkins searched the build log.
        set -o pipefail
        "${ARGS[@]}" 2>&1 | tee "${BUILD_LOG_FILE}"

    - name: Mark the build as unstable if plugins failed to build
      # distribution-build.jenkinsfile:1067-1071 markStageUnstableIfPluginsFailedToBuild() searched the stage log for
      # 'Failed plugins are' and turned the stage UNSTABLE. GitHub Actions has no UNSTABLE result between success and
      # failure, so the closest equivalent is a warning annotation on the job (docs/jenkins-to-actions.md).
      if: always()
      shell: bash
      env:
        BUILD_LOG_FILE: ${{ inputs.build-log-file }}
      run: |
        set -euo pipefail
        if [ -f "${BUILD_LOG_FILE}" ] && grep -q 'Failed plugins are' "${BUILD_LOG_FILE}"; then
          grep 'Failed plugins are' "${BUILD_LOG_FILE}" | tail -1
          echo '::warning title=Plugins failed to build::Some plugins failed to build. See the ./build.sh step for logs and more details'
        fi
