---
name: 'Download Build Manifest'
description: >-
  Port of the shared-library step downloadBuildManifest() (opensearch-build-libraries
  vars/downloadBuildManifest.groovy). Curls the build manifest to a local path and exposes the fields the integ-test
  workflow branches on.

inputs:
  url:
    description: 'Build manifest URL'
    required: true
  path:
    description: 'Local path the manifest is written to'
    required: false
    default: 'build-manifest.yml'
  job-name:
    description: 'Build job name used to compute the artifact root, the Jenkins BUILD_JOB_NAME'
    required: false
    default: 'distribution-build-opensearch'

outputs:
  build-id:
    description: 'build.id of the manifest'
    value: ${{ steps.info.outputs.build-id }}
  version:
    description: 'build.version of the manifest'
    value: ${{ steps.info.outputs.version }}
  platform:
    description: 'build.platform of the manifest'
    value: ${{ steps.info.outputs.platform }}
  architecture:
    description: 'build.architecture of the manifest'
    value: ${{ steps.info.outputs.architecture }}
  distribution:
    description: 'build.distribution of the manifest'
    value: ${{ steps.info.outputs.distribution }}
  artifact-path:
    description: 'Artifact root of the build inside the artifact bucket'
    value: ${{ steps.info.outputs.artifact-root }}
  runs-on:
    description: >-
      Runner label for this platform/architecture, the equivalent of the agent_nodes map in
      integ-test.jenkinsfile:18-22. See docs/jenkins-to-actions.md for how these labels map to runners.
    value: ${{ steps.runner.outputs.runs-on }}

runs:
  using: 'composite'
  steps:
    - name: Download the build manifest
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$(dirname '${{ inputs.path }}')"
        curl -sSL --retry 5 '${{ inputs.url }}' --output '${{ inputs.path }}'
        cat '${{ inputs.path }}'

    - name: Read the build manifest
      id: info
      shell: bash
      run: |
        set -euo pipefail
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        BUILD_ID=$(python3 -c "import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))['build']['id'])" '${{ inputs.path }}')
        python3 "${GITHUB_WORKSPACE}/.github/scripts/manifest_paths.py" build-manifest-info \
          '${{ inputs.path }}' \
          --job-name '${{ inputs.job-name }}' \
          --build-number "${BUILD_ID}" | tee -a "$GITHUB_OUTPUT"

    - name: Select the runner for the build platform
      id: runner
      shell: bash
      run: |
        set -euo pipefail
        case '${{ steps.info.outputs.platform }}_${{ steps.info.outputs.architecture }}' in
          linux_x64) RUNNER='ubuntu-24.04' ;;
          linux_arm64) RUNNER='ubuntu-24.04-arm' ;;
          windows_x64) RUNNER='windows-2022' ;;
          *) echo "::error::No runner mapping for ${{ steps.info.outputs.platform }}_${{ steps.info.outputs.architecture }}"; exit 1 ;;
        esac
        echo "runs-on=${RUNNER}" >> "$GITHUB_OUTPUT"
