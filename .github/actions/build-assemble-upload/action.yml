---
name: 'Build, Assemble and Upload'
description: >-
  Port of the shared-library step buildAssembleUpload() (opensearch-build-libraries vars/buildAssembleUpload.groovy),
  used by the tar and zip stages of distribution-build.jenkinsfile (lines 245-259, 592-606, 897-911). It is
  buildManifest() followed by assembleUpload() on the manifest build.sh just produced.

inputs:
  input-manifest:
    description: 'Relative path to the input manifest'
    required: true
  component-name:
    description: 'Single component to build'
    required: false
    default: ''
  distribution:
    description: 'Distribution to build'
    required: true
  platform:
    description: 'Platform to build'
    required: true
  architecture:
    description: 'Architecture to build'
    required: true
  continue-on-error:
    description: 'Do not fail the distribution build when a plugin component fails'
    required: false
    default: 'false'
  skip-artifact-check:
    description: 'Skip the artifact check build.sh runs after every component'
    required: false
    default: 'false'
  incremental:
    description: 'Build only the components that changed since the previous build'
    required: false
    default: 'false'
  previous-build-id:
    description: 'Build id to start the incremental build from'
    required: false
    default: 'latest'
  parallel:
    description: 'Number of parallel component workers'
    required: false
    default: '0'
  job-name:
    description: 'Artifact path prefix, equivalent to the Jenkins JOB_NAME'
    required: false
    default: 'distribution-build-opensearch'
  build-number:
    description: 'Build number, equivalent to the Jenkins BUILD_NUMBER'
    required: true
  public-artifact-url:
    description: 'Public artifact URL'
    required: false
    default: 'https://ci.opensearch.org/ci/dbc'
  artifact-bucket-name:
    description: 'Staging artifact bucket'
    required: true
  aws-account-public:
    description: 'AWS account holding the staging bucket'
    required: true
  artifact-production-bucket-name:
    description: 'Production artifact bucket used for release candidates'
    required: false
    default: ''
  aws-account-artifact:
    description: 'AWS account holding the production bucket'
    required: false
    default: ''
  artifact-promotion-role-name:
    description: 'Role assumed to write into the production bucket'
    required: false
    default: ''
  sign-rpm:
    description: 'Sign rpm packages during assemble'
    required: false
    default: 'false'
  rpm-signing-account:
    description: 'AWS account holding the rpm signing role'
    required: false
    default: ''

outputs:
  build-manifest:
    description: 'Path of the build manifest generated by build.sh'
    value: ${{ steps.build.outputs.build-manifest }}
  build-manifest-url:
    description: 'URL of the uploaded build manifest'
    value: ${{ steps.assemble.outputs.build-manifest-url }}
  index-file-root:
    description: 'Index file path used by upload-index-file'
    value: ${{ steps.assemble.outputs.index-file-root }}
  artifact-url:
    description: 'BuildManifest.getArtifactUrl(), the tarball URL the docker build stage consumes'
    value: ${{ steps.assemble.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Build the distribution
      id: build
      uses: ./.github/actions/build-manifest
      with:
        input-manifest: ${{ inputs.input-manifest }}
        component-name: ${{ inputs.component-name }}
        distribution: ${{ inputs.distribution }}
        platform: ${{ inputs.platform }}
        architecture: ${{ inputs.architecture }}
        continue-on-error: ${{ inputs.continue-on-error }}
        skip-artifact-check: ${{ inputs.skip-artifact-check }}
        incremental: ${{ inputs.incremental }}
        build-log-file: build-${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.distribution }}.log
        previous-build-id: ${{ inputs.previous-build-id }}
        parallel: ${{ inputs.parallel }}
        job-name: ${{ inputs.job-name }}
        public-artifact-url: ${{ inputs.public-artifact-url }}
        artifact-bucket-name: ${{ inputs.artifact-bucket-name }}
        aws-account-public: ${{ inputs.aws-account-public }}

    - name: Assemble and upload the distribution
      id: assemble
      uses: ./.github/actions/assemble-upload
      with:
        build-manifest: ${{ steps.build.outputs.build-manifest }}
        job-name: ${{ inputs.job-name }}
        build-number: ${{ inputs.build-number }}
        public-artifact-url: ${{ inputs.public-artifact-url }}
        artifact-bucket-name: ${{ inputs.artifact-bucket-name }}
        aws-account-public: ${{ inputs.aws-account-public }}
        artifact-production-bucket-name: ${{ inputs.artifact-production-bucket-name }}
        aws-account-artifact: ${{ inputs.aws-account-artifact }}
        artifact-promotion-role-name: ${{ inputs.artifact-promotion-role-name }}
        sign-rpm: ${{ inputs.sign-rpm }}
        rpm-signing-account: ${{ inputs.rpm-signing-account }}
