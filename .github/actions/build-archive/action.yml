---
name: 'Build Archive'
description: >-
  Port of the shared-library step buildArchive() (opensearch-build-libraries vars/buildArchive.groovy), used by the rpm
  and deb stages of distribution-build.jenkinsfile (lines 328-345, 442-461, 646-663, 760-779). It runs buildManifest()
  and then hands <distribution>/builds to the assemble stage. Jenkins used `stash`; the GitHub Actions equivalent is an
  uploaded artifact, which archive-assemble-upload downloads.

inputs:
  input-manifest:
    description: 'Relative path to the input manifest'
    required: true
  component-name:
    description: 'Single component to build'
    required: false
    default: ''
  distribution:
    description: 'Distribution to build'
    required: true
  platform:
    description: 'Platform to build'
    required: true
  architecture:
    description: 'Architecture to build'
    required: true
  continue-on-error:
    description: 'Do not fail the distribution build when a plugin component fails'
    required: false
    default: 'false'
  skip-artifact-check:
    description: 'Skip the artifact check build.sh runs after every component'
    required: false
    default: 'false'
  incremental:
    description: 'Build only the components that changed since the previous build'
    required: false
    default: 'false'
  previous-build-id:
    description: 'Build id to start the incremental build from'
    required: false
    default: 'latest'
  parallel:
    description: 'Number of parallel component workers'
    required: false
    default: '0'
  job-name:
    description: 'Artifact path prefix, equivalent to the Jenkins JOB_NAME'
    required: false
    default: 'distribution-build-opensearch'
  public-artifact-url:
    description: 'Public artifact URL'
    required: false
    default: 'https://ci.opensearch.org/ci/dbc'
  artifact-bucket-name:
    description: 'Staging artifact bucket, only needed for incremental builds'
    required: false
    default: ''
  aws-account-public:
    description: 'AWS account holding the staging bucket, only needed for incremental builds'
    required: false
    default: ''
  stash-name:
    description: 'Name of the uploaded artifact, the equivalent of the Jenkins stash name'
    required: true
  build-number:
    description: 'Build number, equivalent to the Jenkins BUILD_NUMBER. Stamped into build.id by build.sh.'
    required: true

outputs:
  build-manifest:
    description: 'Path of the build manifest generated by build.sh'
    value: ${{ steps.build.outputs.build-manifest }}

runs:
  using: 'composite'
  steps:
    - name: Build the distribution
      id: build
      uses: ./.github/actions/build-manifest
      with:
        input-manifest: ${{ inputs.input-manifest }}
        component-name: ${{ inputs.component-name }}
        distribution: ${{ inputs.distribution }}
        platform: ${{ inputs.platform }}
        architecture: ${{ inputs.architecture }}
        continue-on-error: ${{ inputs.continue-on-error }}
        skip-artifact-check: ${{ inputs.skip-artifact-check }}
        incremental: ${{ inputs.incremental }}
        build-log-file: build-${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.distribution }}.log
        previous-build-id: ${{ inputs.previous-build-id }}
        parallel: ${{ inputs.parallel }}
        job-name: ${{ inputs.job-name }}
        build-number: ${{ inputs.build-number }}
        public-artifact-url: ${{ inputs.public-artifact-url }}
        artifact-bucket-name: ${{ inputs.artifact-bucket-name }}
        aws-account-public: ${{ inputs.aws-account-public }}

    - name: Stash the builds to assemble later
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ inputs.stash-name }}
        path: ${{ inputs.distribution }}/builds/**
        retention-days: 1
        include-hidden-files: true
