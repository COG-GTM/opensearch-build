# parameterizedCron entries of jenkins/check-for-build.jenkinsfile (`H 1 * * *` per input manifest), read by
# .github/scripts/scheduled_builds.py for .github/workflows/check-for-build.yml. Jenkins `H` became a fixed minute;
# every cron here must also be listed under on.schedule in that workflow, and every active input manifest under
# manifests/ needs an entry (tests/tests_github_scripts/test_scheduled_builds.py checks both).
---
entries:
  - cron: 17 1 * * *
    params:
      INPUT_MANIFEST: 3.10.0/opensearch-3.10.0.yml
      TARGET_JOB_NAME: distribution-build-opensearch
      BUILD_PLATFORM: linux windows
      BUILD_DISTRIBUTION: tar rpm deb zip
  - cron: 17 1 * * *
    params:
      INPUT_MANIFEST: 3.9.0/opensearch-dashboards-3.9.0.yml
      TARGET_JOB_NAME: distribution-build-opensearch-dashboards
      BUILD_PLATFORM: linux windows
      BUILD_DISTRIBUTION: tar rpm deb zip
      TEST_MANIFEST: 3.9.0/opensearch-dashboards-3.9.0-test.yml
      TEST_PLATFORM: linux
      TEST_DISTRIBUTION: tar
  - cron: 17 1 * * *
    params:
      INPUT_MANIFEST: 3.9.0/opensearch-3.9.0.yml
      TARGET_JOB_NAME: distribution-build-opensearch
      BUILD_PLATFORM: linux windows
      BUILD_DISTRIBUTION: tar rpm deb zip
      TEST_MANIFEST: 3.9.0/opensearch-3.9.0-test.yml
      TEST_PLATFORM: linux
      TEST_DISTRIBUTION: tar
  - cron: 17 1 * * *
    params:
      INPUT_MANIFEST: 3.8.1/opensearch-3.8.1.yml
      TARGET_JOB_NAME: distribution-build-opensearch
      BUILD_PLATFORM: linux windows
      BUILD_DISTRIBUTION: tar
      UPDATE_GITHUB_ISSUE: 'false'
