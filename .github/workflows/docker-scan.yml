---
# GitHub Actions port of jenkins/docker/docker-scan-lf.jenkinsfile (scanDockerImage step -> .github/actions/trivy-scan).
# Same trivy (the one in the ci-runner image), same commands and the same archived scan_docker_image.txt / .json.
# workflow_call replaces the `build job: 'docker-scan'` call in buildDockerImage.
# pull_request runs the same job on a GitHub-hosted runner against a public image (the scan needs no secrets).
name: docker-scan
run-name: docker-scan ${{ inputs.IMAGE_FULL_NAME || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      IMAGE_FULL_NAME:
        description: '<Required> Example : ''opensearchstaging/opensearch:2.0.0'', ''public.ecr.aws/opensearchstaging/opensearch:2.0.0'', ''alpine:3'', ''ubuntu:20.04'''
        required: true
        type: string
  workflow_call:
    inputs:
      IMAGE_FULL_NAME:
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/docker-scan.yml'
      - '.github/actions/trivy-scan/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
  TRIVY_DISABLE_VEX_NOTICE: 'true'
  # PR runs scan the image docker-re-release patches; dispatch/call runs scan the requested image
  IMAGE_FULL_NAME: ${{ github.event_name == 'pull_request' && 'opensearchproject/opensearch:3' || inputs.IMAGE_FULL_NAME }}

jobs:
  image-scan:
    name: Image Scan (Trivy)
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "linux", "x64", "al2023-x64-m5-4xlarge-docker-host"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      # ci-runner:ubuntu2404-x64-docker-buildx0.9.1-qemu8.2-v1 (ships trivy), via the ECR mirror
      image: public.ecr.aws/opensearchorg/opensearchstaging/ci-runner@sha256:fcad3fee89c90b1f12a224b0dd46609767ace97102b707c1a2a13addfafeff6c
      options: -u root -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Parameters Check
        run: |
          set -euo pipefail
          echo "Scanning: ${IMAGE_FULL_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          if [ -z "${IMAGE_FULL_NAME}" ]; then
            echo "::error::Make sure all the parameters are passed in."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Scan Images
        uses: ./.github/actions/trivy-scan
        with:
          image-full-name: ${{ env.IMAGE_FULL_NAME }}
          image-result-file: scan_docker_image
      - name: Report summary
        if: always()
        run: |
          [ -s scan_docker_image.txt ] || exit 0
          {
            echo '```'
            head -n 40 scan_docker_image.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: scan_docker_image
          path: scan_docker_image.*
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: trivy clean --all
