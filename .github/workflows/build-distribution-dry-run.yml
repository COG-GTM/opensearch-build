---
# Dry run of the reusable _build-distribution.yml and _integ-test.yml on a GitHub-hosted runner, without AWS secrets:
# builds the OpenSearch min snapshot (buildManifest(componentName: "OpenSearch", snapshot: true), as
# publish-min-snapshots.jenkinsfile does) for linux x64 tar, keeps the build record in the run instead of uploading it,
# and diffs its file names and manifest layout against the latest Jenkins distribution-build-opensearch build of the
# same version. The integ-test leg runs one component against that Jenkins build's public artifacts.
name: build-distribution-dry-run

on:
  pull_request:
    paths:
      - .github/workflows/_build-distribution.yml
      - .github/workflows/_integ-test.yml
      - .github/workflows/build-distribution-dry-run.yml
      - .github/actions/assemble-upload/**
      - .github/scripts/manifest_paths.py
      - .github/scripts/compare_build_layout.py
  workflow_dispatch:
    inputs:
      input-manifest:
        description: 'Input manifest under manifests/'
        required: false
        default: '3.9.0/opensearch-3.9.0.yml'
        type: string
      integ-test-component:
        description: 'Test-manifest component the integ-test leg runs against the Jenkins build'
        required: false
        default: 'opensearch-system-templates'
        type: string

permissions: {}

concurrency:
  group: build-distribution-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-distribution.yml
    permissions:
      contents: read
      id-token: write
    with:
      input-manifest: ${{ inputs.input-manifest || '3.9.0/opensearch-3.9.0.yml' }}
      distribution: tar
      platform: linux
      architecture: x64
      component-name: OpenSearch
      snapshot: true
      upload: false
      runs-on: '["ubuntu-24.04"]'

  jenkins:
    name: latest Jenkins build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      root: ${{ steps.latest.outputs.root }}
      version: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the latest distribution-build-opensearch build
        id: latest
        env:
          INPUT_MANIFEST: ${{ inputs.input-manifest || '3.9.0/opensearch-3.9.0.yml' }}
        run: |
          set -euo pipefail
          VERSION=$(python3 .github/scripts/manifest_paths.py input-manifest-info "manifests/${INPUT_MANIFEST}" | sed -n 's/^revision=//p')
          INDEX="https://ci.opensearch.org/ci/dbc/distribution-build-opensearch/${VERSION}/index/linux/x64/tar/index.json"
          LATEST=$(curl -sSfL --retry 5 "${INDEX}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["latest"])')
          [[ "${LATEST}" =~ ^[0-9]+$ ]] || { echo "::error::unexpected latest build '${LATEST}' in ${INDEX}"; exit 1; }
          {
            echo "version=${VERSION}"
            echo "root=https://ci.opensearch.org/ci/dbc/distribution-build-opensearch/${VERSION}/${LATEST}/linux/x64/tar"
          } | tee -a "$GITHUB_OUTPUT"

  compare:
    name: diff against Jenkins
    needs: [build, jenkins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: build-record-linux-x64-tar
          path: build-record
      - name: Diff file names and manifest layout
        env:
          JENKINS_ROOT: ${{ needs.jenkins.outputs.root }}
          BUILD_MANIFEST: ${{ needs.build.outputs.build-manifest }}
          BUILD_MANIFEST_URL: ${{ needs.build.outputs.build-manifest-url }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          {
            echo "Jenkins: ${JENKINS_ROOT}"
            echo "Actions outputs: build-manifest=${BUILD_MANIFEST} build-manifest-url=${BUILD_MANIFEST_URL} artifact-url=${ARTIFACT_URL}"
            echo
          } | tee diff.txt
          set +e
          python3 .github/scripts/compare_build_layout.py --record build-record --jenkins-root "${JENKINS_ROOT}" | tee -a diff.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${STATUS}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: ${{ always() }}
        with:
          name: jenkins-layout-diff
          path: diff.txt

  integ-test:
    needs: jenkins
    uses: ./.github/workflows/_integ-test.yml
    permissions:
      contents: read
      id-token: write
    with:
      test-manifest: ${{ needs.jenkins.outputs.version }}/opensearch-${{ needs.jenkins.outputs.version }}-test.yml
      build-manifest-url: ${{ needs.jenkins.outputs.root }}/builds/opensearch/manifest.yml
      component-name: ${{ inputs.integ-test-component || 'opensearch-system-templates' }}
      download-artifacts: false
      upload-results: false
      runs-on: '["ubuntu-24.04"]'
