---
# Ports jenkins/release-workflows/release-tag.jenkinsfile:18-85 and
# opensearch-build-libraries vars/createReleaseTag.groovy:9-70. See
# docs/jenkins-to-actions-release-promotion.md. Tagging every component
# repository is irreversible, so production-release-tags requires reviewers.
name: Distribution Release Tag Creation

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: '<Required> Version of the release.'
        required: true
        default: ''
        type: string
      MANIFEST_LOCK_WORKFLOW:
        description: '<Optional> Workflow to trigger for manifest lock; empty prints the Jenkins parameters without triggering.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string
      MANIFEST_LOCK_WORKFLOW:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  create-tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-release-tags
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        product:
          - opensearch
          - opensearch-dashboards
    env:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Download release manifest
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ inputs.VERSION }}
        run: |
          set -euo pipefail
          archive="${PRODUCT}-${VERSION}-linux-x64.tar.gz"
          curl -fsSL "https://artifacts.opensearch.org/releases/bundle/${PRODUCT}/${VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          mkdir -p "${GITHUB_WORKSPACE}/release-manifests/${PRODUCT}-${VERSION}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${GITHUB_WORKSPACE}/release-manifests/${PRODUCT}-${VERSION}" \
            "${PRODUCT}-${VERSION}/manifest.yml"
      - name: Create release tags
        uses: ./.github/actions/create-release-tag
        with:
          dist-manifest: ${{ github.workspace }}/release-manifests/${{ matrix.product }}-${{ inputs.VERSION }}/${{ matrix.product }}-${{ inputs.VERSION }}/manifest.yml
          tag-version: ${{ inputs.VERSION }}
          github-bot-token: ${{ env.RELEASE_BOT_TOKEN }}
  lock-manifests:
    needs: create-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
    steps:
      - name: Report or trigger manifest lock
        shell: bash
        env:
          VERSION: ${{ inputs.VERSION }}
          LOCK_WORKFLOW: ${{ inputs.MANIFEST_LOCK_WORKFLOW }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${LOCK_WORKFLOW}" ]]; then
            echo "::notice::Jenkins would have triggered release-manifest-commit-lock with RELEASE_VERSION=${VERSION} and MANIFEST_LOCK_ACTION=UPDATE_TO_TAGS"
            exit 0
          fi
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "${LOCK_WORKFLOW}" \
            --field "RELEASE_VERSION=${VERSION}" \
            --field 'MANIFEST_LOCK_ACTION=UPDATE_TO_TAGS' \
            --ref main
          # Only accept a run created after the dispatch; "--limit 1" alone can watch
          # a previous run and report success for a lock that never started.
          run_id=''
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --workflow "${LOCK_WORKFLOW}" --limit 30 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty")
            if [[ -n "${run_id}" ]]; then break; fi
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::No ${LOCK_WORKFLOW} run appeared within 5 minutes of the dispatch."
            exit 1
          fi
          gh run watch "${run_id}" --exit-status
