---
# GitHub Actions port of jenkins/integ-test-notification.jenkinsfile (updateIntegTestFailureIssues, jenkins@12.0.0).
# .github/scripts/integ_test_failures.py reads the integration test results from the metrics cluster and the
# notify-failure action creates, edits, reopens or closes the "[AUTOCUT] Integration Test Failed" issues.
# The integ-test workflows (s4.3) call this with workflow_call instead of `build job: 'integ-test-notification'`.
# Pull requests that touch it run a dry run for the current release through the public metrics Dashboards proxy.
name: integ-test-notification
run-name: integ-test-notification ${{ inputs.INPUT_MANIFEST }}

on:
  workflow_dispatch:
    inputs:
      INPUT_MANIFEST:
        description: '<Required> Input manifest under the manifests folder, e.g. 2.0.0/opensearch-2.0.0.yml.'
        required: true
        type: string
      DISTRIBUTION_NUMBER:
        description: '<Optional> Distribution build number used to run the integration tests, e.g. 10345. Defaults to the latest build of the version.'
        required: false
        default: ''
        type: string
      DRY_RUN:
        description: Print the issues that would be opened, updated or closed instead of writing them.
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      INPUT_MANIFEST:
        description: Input manifest under the manifests folder, e.g. 2.0.0/opensearch-2.0.0.yml.
        required: true
        type: string
      DISTRIBUTION_NUMBER:
        description: Distribution build number used to run the integration tests.
        required: false
        default: ''
        type: string
      DRY_RUN:
        description: Print the issue updates instead of writing them.
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ROLE_METRICS:
        description: Role ARN for the metrics cluster (replaces OpenSearchJenkinsAccessRole).
        required: false
      METRICS_CLUSTER_ENDPOINT:
        description: Metrics cluster endpoint (replaces op:metrics-cluster/jenkins-health-metrics-cluster-endpoint).
        required: false
      GH_APP_ID:
        description: GitHub App ID used to mint the issues:write token.
        required: false
      GH_APP_PRIVATE_KEY:
        description: GitHub App private key.
        required: false
  pull_request:
    paths:
      - .github/workflows/integ-test-notification.yml
      - .github/scripts/integ_test_failures.py
      - .github/scripts/metrics_cluster.py
      - .github/scripts/notify_failure.py
      - .github/actions/notify-failure/**

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  manifests:
    name: Resolve input manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      manifests: ${{ steps.resolve.outputs.manifests }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve input manifests
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MANIFEST: ${{ inputs.INPUT_MANIFEST }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -z "$INPUT_MANIFEST" ]; then
            # current release: the newest version folder with both distribution input manifests
            release=$(find manifests -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -printf '%f\n' | sort -V |
              while read -r v; do
                if [ -f "manifests/$v/opensearch-$v.yml" ] && [ -f "manifests/$v/opensearch-dashboards-$v.yml" ]; then echo "$v"; fi
              done | tail -n 1)
            manifests=("$release/opensearch-$release.yml" "$release/opensearch-dashboards-$release.yml")
            DRY_RUN=true
          else
            if [ -z "$INPUT_MANIFEST" ] || [ ! -f "manifests/$INPUT_MANIFEST" ]; then
              echo "::error::Failed to start the workflow. Input manifest was not provided or not found in manifests/$INPUT_MANIFEST."
              exit 1
            fi
            manifests=("$INPUT_MANIFEST")
            # pull requests (including the test workflows' dry runs that call this one) never write issues
            [ "$EVENT_NAME" = "pull_request" ] && DRY_RUN=true
          fi
          echo "manifests=$(printf '%s\n' "${manifests[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "dry-run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

  update-integ-test-failure-issues:
    name: Update integ tests failure issues (${{ matrix.input-manifest }})
    needs: manifests
    # Jenkins ran this on Jenkins-Agent-AL2023-X64-M54xlarge-Docker-Host only for the ci-runner image; the job makes
    # HTTPS calls to the metrics cluster and the GitHub API, so it runs on a hosted runner and can serve the PR dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        input-manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Select metrics source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ needs.manifests.outputs.dry-run }}
          HAS_ENDPOINT: ${{ secrets.METRICS_CLUSTER_ENDPOINT != '' && secrets.AWS_ROLE_METRICS != '' }}
        run: |
          # pull requests cannot assume AWS_ROLE_METRICS (its OIDC trust is main / environment ci)
          if [ "$HAS_ENDPOINT" = "true" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            echo "source=cluster" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::notice::METRICS_CLUSTER_ENDPOINT / AWS_ROLE_METRICS not set; the dry run reads the public metrics Dashboards proxy."
            echo "source=public" >> "$GITHUB_OUTPUT"
          else
            echo "::error::METRICS_CLUSTER_ENDPOINT and AWS_ROLE_METRICS are required to update issues."
            exit 1
          fi

      - name: Configure AWS credentials for the metrics cluster
        if: steps.source.outputs.source == 'cluster'
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_METRICS }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - name: Install query dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/metrics-venv"
          "$RUNNER_TEMP/metrics-venv/bin/pip" install --quiet 'requests==2.32.4' 'requests-aws4auth==1.3.1' 'PyYAML==6.0.2'

      - name: Query integration test results
        id: query
        env:
          INPUT_MANIFEST: ${{ matrix.input-manifest }}
          DISTRIBUTION_NUMBER: ${{ inputs.DISTRIBUTION_NUMBER }}
          SOURCE: ${{ steps.source.outputs.source }}
          METRICS_CLUSTER_ENDPOINT: ${{ steps.source.outputs.source == 'cluster' && secrets.METRICS_CLUSTER_ENDPOINT || '' }}
        run: |
          args=(--input-manifest "manifests/$INPUT_MANIFEST" --distribution-number "$DISTRIBUTION_NUMBER" --report "$RUNNER_TEMP/integ-test-results.json")
          if [ "$SOURCE" = "public" ]; then args+=(--dashboards-url https://metrics.opensearch.org/_dashboards); fi
          "$RUNNER_TEMP/metrics-venv/bin/python" .github/scripts/integ_test_failures.py "${args[@]}"

      - name: Update AUTOCUT issues
        # skipped: a GitHub run id build number, out of the metrics integer range
        if: steps.query.outputs.skipped != 'true'
        uses: ./.github/actions/notify-failure
        with:
          kind: integ-test
          input-manifest: manifests/${{ matrix.input-manifest }}
          failures: ${{ steps.query.outputs.failures }}
          passed: ${{ steps.query.outputs.passed }}
          release-owners: ${{ steps.query.outputs.release-owners }}
          dry-run: ${{ needs.manifests.outputs.dry-run }}
          app-id: ${{ secrets.GH_APP_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
