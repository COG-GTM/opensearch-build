# Runner pools for ADR 0001 (docs/adr/0001-gha-runners-and-secrets.md), one per row of its label map.
# `labels` is the full `runs-on` array; tests/tests_deployment checks it against the ADR table.
# `id` is the short name used in AWS resource names (EventBridge/IAM names are capped at 64 chars).
al2023-x64-m5-4xlarge-docker-host:
  id: al2023-x64-dhost
  jenkins_label: AL2023-X64-M54xlarge-Docker-Host
  os: linux
  arch: x64
  labels: [self-hosted, linux, x64, al2023-x64-m5-4xlarge-docker-host]
  instance_type: m5.4xlarge
  max_runners: 40
  volume_size_gb: 200
